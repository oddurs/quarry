[package]
name = "quarry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "See every server running on this machine, and whose project it came from"
authors = ["Oddur Sigurdsson"]
license = "MIT"
repository = "https://github.com/oddurs/quarry"
homepage = "https://oddurs.github.io/quarry"
documentation = "https://github.com/oddurs/quarry#readme"
readme = "README.md"
keywords = ["tui", "ports", "localhost", "devtools", "monitoring"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "cairn/", "ROADMAP.md", "tests/snapshots/"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.189"
open = "5.4.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.5"
ureq = "3.4.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
libc = "0.2.189"
ratatui = "0.30.2"
tempfile = "3.27.0"
