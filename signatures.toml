# ─── db ──────────────────────────────────────────────────────────────

[[signature]]
name = "Aerospike"
kind = "db"
ports = [3000, 3001, 3002, 3003]
process = ["aerospike", "asd"]
note = "3000 client service, 3001 fabric, 3002 heartbeat, 3003 info. The daemon binary is asd, a short substring — prefer a path match on /aerospike/ where argv gives one."

[[signature]]
name = "Apache Cassandra"
kind = "db"
ports = [9042]
process = ["cassandra"]
note = "9042 is the CQL native transport. Internode (7000/7001) and JMX (7199) are also opened but are too widely shared to claim."

[[signature]]
name = "Apache CouchDB"
kind = "db"
ports = [5984, 6984]
process = ["couchdb"]
http_server = "CouchDB*"
health = "/_up"
uri = "http://localhost:{port}/_utils/"
note = "Runs on the Erlang VM, so argv often shows beam.smp with couchdb only in the path. 6984 is the TLS listener."

[[signature]]
name = "ArangoDB"
kind = "db"
ports = [8529]
process = ["arangod"]
http_server = "ArangoDB*"
health = "/_admin/server/availability"
uri = "http://localhost:{port}/"

[[signature]]
name = "ClickHouse"
kind = "db"
ports = [8123, 9000, 9004, 9005]
process = ["clickhouse-server", "clickhouse"]
health = "/ping"
note = "8123 HTTP, 9000 native TCP, 9004 MySQL-compatible, 9005 PostgreSQL-compatible. GET / on 8123 returns the plain text 'Ok.' with no HTML title."

[[signature]]
name = "CockroachDB"
kind = "db"
ports = [26257]
process = ["cockroach"]
uri = "postgresql://root@localhost:{port}/defaultdb?sslmode=disable"
probe = "postgres"
note = "Speaks the PostgreSQL wire protocol on 26257; the DB Console is a separate HTTP listener that defaults to 8080."

