ports = [5433]
process = ["yb-tserver", "yb-master", "yugabyted"]
uri = "postgresql://yugabyte@localhost:{port}/yugabyte"
probe = "postgres"
note = "YSQL sits on 5433, not 5432, so it can coexist with PostgreSQL; the master and tserver web UIs default to 7000 and 9000."


