kind = "db"
ports = [8091, 8092, 8093, 8094, 11210]
process = ["couchbase"]
note = "8091 admin console, 8092 views, 8093 N1QL query, 8094 search, 11210 KV binary protocol. It ships its own memcached binary, so argv shows memcached under a couchbase path and its 11211 listener can look like plain Memcached."

