ports = [54322]
process = ["postgres"]
uri = "postgresql://postgres:postgres@localhost:{port}/postgres"
probe = "postgres"
note = "The Supabase CLI stack pins the database to 54322 (API 54321, Studio 54323), which is how it is told apart from a plain PostgreSQL on 5432."

[[signature]]
