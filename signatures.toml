health = "/status"
probe = "mysql"
note = "MySQL wire protocol on 4000, so it looks like MySQL to a protocol probe; 10080 is the HTTP status server. 4000 is also LiteLLM's port, so the process name decides."

[[signature]]
name = "TiKV"
kind = "db"
ports = [20160, 20180]
process = ["tikv-server"]
note = "20160 gRPC, 20180 status and metrics."

[[signature]]
name = "YugabyteDB"
