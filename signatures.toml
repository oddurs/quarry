ports = [2379, 2380]
process = ["pd-server"]
note = "Embeds etcd and therefore takes etcd's 2379/2380. Only the pd-server argv distinguishes it from a plain etcd."

[[signature]]
name = "PostgreSQL"
kind = "db"
ports = [5432, 5433]
process = ["postgres", "postmaster"]
uri = "postgres://localhost:{port}/"
probe = "postgres"

[[signature]]
name = "QuestDB"
kind = "db"
ports = [9000, 8812, 9009]
process = ["questdb"]
http_title = "QuestDB*"
note = "9000 web console and REST, 8812 PostgreSQL wire protocol, 9009 InfluxDB line protocol. 9000 collides with MinIO, Portainer and ClickHouse native."

[[signature]]
name = "RethinkDB"
kind = "db"
ports = [28015, 29015, 8080]
process = ["rethinkdb"]
note = "28015 driver, 29015 intracluster, 8080 admin UI. The driver port is client-first — the client sends a version magic number before anything comes back."

[[signature]]
name = "ScyllaDB"
kind = "db"
ports = [9042, 19042]
process = ["scylla"]
note = "Cassandra-compatible, so 9042 collides with Cassandra — the scylla process name is the only reliable split. 19042 is the shard-aware CQL port and is Scylla-only."

[[signature]]
name = "SQL Server"
kind = "db"
ports = [1433]
process = ["sqlservr"]

[[signature]]
