[[signature]]
name = "Gel"
kind = "db"
ports = [5656]
process = ["gel-server", "edgedb-server"]
uri = "gel://localhost:{port}"
note = "Formerly EdgeDB; older installs still run edgedb-server on the same port and answer gel:// as edgedb://."

[[signature]]
name = "InfluxDB"
kind = "db"
ports = [8086, 8181]
process = ["influxd", "influxdb3"]
http_title = "InfluxDB*"
health = "/health"
uri = "http://localhost:{port}/"
note = "8086 is v1/v2; InfluxDB 3 Core and Enterprise default to 8181. v1 answers /ping rather than /health."

[[signature]]
name = "libSQL server"
kind = "db"
ports = [8080]
process = ["sqld", "libsql-server"]
health = "/health"
uri = "http://localhost:{port}"
note = "SQLite over HTTP/Hrana rather than a binary SQL port; 8080 is heavily shared, so the sqld process name is what identifies it."

[[signature]]
name = "MariaDB"
kind = "db"
ports = [3306]
process = ["mariadbd", "mariadbd-safe", "mysqld"]
uri = "mysql://root@localhost:{port}/"
probe = "mysql"
note = "Process is mariadbd on 10.5+ but still mysqld on older builds; the handshake version string reads 5.5.5-<real version>-MariaDB for legacy client compatibility."

[[signature]]
name = "Memgraph"
kind = "db"
ports = [7687]
process = ["memgraph"]
uri = "bolt://localhost:{port}"
note = "Speaks Bolt on 7687 exactly like Neo4j; only the process name separates them."

[[signature]]
name = "Microsoft SQL Server"
kind = "db"
ports = [1433]
process = ["sqlservr"]
uri = "sqlserver://localhost:{port}"
note = "TDS: the client sends PRELOGIN first, so nothing arrives unprompted. The SQL Server Browser on 1434 is UDP only."

[[signature]]
name = "MongoDB"
kind = "db"
ports = [27017, 27018, 27019]
process = ["mongod"]
uri = "mongodb://localhost:{port}"
probe = "mongodb"

[[signature]]
name = "MySQL"
kind = "db"
ports = [3306, 3307]
process = ["mysqld", "mariadbd"]
uri = "mysql://localhost:{port}"
probe = "mysql"

[[signature]]
name = "Neo4j"
kind = "db"
ports = [7687, 7474, 7473]
process = ["neo4j"]
http_title = "Neo4j Browser*"
note = "7687 Bolt, 7474 HTTP browser, 7473 HTTPS. Bolt is client-first: the client sends the 0x6060B017 magic before the server replies."

[[signature]]
name = "Oracle Database Free"
kind = "db"
ports = [1521]
process = ["tnslsnr", "ora_pmon"]
uri = "oracle://localhost:{port}/FREEPDB1"
note = "Successor to Oracle XE; the listener process is tnslsnr and the pluggable database service name is FREEPDB1 on 23ai, XEPDB1 on 18c/21c XE."

[[signature]]
name = "PD (TiDB Placement Driver)"
