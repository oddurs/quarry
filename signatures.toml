# Service signatures.
#
# quarry identifies a listening socket by scoring evidence against this table.
# The weights live in src/signature.rs: a banner outranks an HTTP title, which
# outranks a Server header, which outranks a process name, which outranks a
# port. Scores add, so a signature matching a port *and* a process name beats
# one matching either alone — which is how two things on port 3000 are told
# apart.
#
# A port is a convention, and a crowded one. An entry claiming a contested port
# must carry something else that distinguishes it, or it will confidently
# mislabel whatever else lands there.
#
# Your own services go in ~/.config/quarry/signatures.toml, in this format.
# They are merged over this file and win ties. See SIGNATURES.md.


# ─── web ───────────────────────────────────────────────────────────────

# ─── web ─────────────────────────────────────────────────────────────

[[signature]]
name = "Angular CLI"
kind = "web"
ports = [4200]
process = ["ng serve", "@angular/cli", "angular-cli"]
uri = "http://localhost:{port}/"
note = "Shares 4200 with Ember CLI; the process string is the only reliable separator."

[[signature]]
name = "Apache HTTP Server"
kind = "web"
ports = [80, 443, 8080]
process = ["httpd", "apache2"]
http_server = "Apache*"
uri = "http://localhost:{port}/"

