uri = "ws://localhost:{port}/rpc"
note = "Shares 8000 with DynamoDB Local and Python dev servers; the Server header and the 'surreal start' argv are the reliable signals."

[[signature]]
name = "TiDB"
kind = "db"
ports = [4000, 10080]
